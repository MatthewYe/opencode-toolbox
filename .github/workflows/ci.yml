name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: cd skills/skill-creator/scripts && bun install

      - run: bun x biome ci .

      - run: bun test
        env:
          BUN_MALLOC_ALLOCATOR: mimalloc

      - run: bun run build

      - run: bun x tsc --project tsconfig.ci.json --noEmit
